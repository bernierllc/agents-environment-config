# Annotated loadout plugin manifest (per-tool install).
# Parses to the same data as plugin.json.
schema: loadout/v1            # const: identifies the loadout schema version
item_type: plugin             # const for plugin manifests
name: my-plugin               # ^[a-z0-9][a-z0-9-]*$
version: 1.0.0
description: "Example per-tool plugin: one scripted install and two instructions-only installs."
source: https://github.com/example/my-plugin
homepage: https://github.com/example/my-plugin
author:
  name: Example Author
  url: https://github.com/example
license: MIT
supports:                     # intersected with detect_agents() at install time
  - claude
  - cursor
  - gemini
usage: Type /my-plugin in your agent.
install_type: per-tool        # requires install.tools
install:
  tools:                      # one entry per supported tool
    claude:                   # `run` => AEC runs it after confirmation (or --yes)
      run: [npx, my-plugin, install, --agent, claude]
    cursor:                   # `steps` => instructions-only, never executed
      steps: "Copy my-plugin's rules into .cursor/rules/ per https://github.com/example/my-plugin#cursor"
    gemini:
      steps: Add my-plugin to your Gemini extensions per https://github.com/example/my-plugin#gemini
uninstall:
  tools:
    claude:
      run: [npx, my-plugin, uninstall, --agent, claude]
    cursor:
      steps: Delete the my-plugin files from .cursor/rules/.
    gemini:
      steps: Remove my-plugin from your Gemini extensions.
