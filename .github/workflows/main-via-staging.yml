# Promotion guard for PRs into main: only a same-repo `staging` branch may open one.
#
# Uses pull_request_target so GitHub loads this workflow from the repository's
# DEFAULT branch (main, or staging in a repo whose default is staging), never from
# the PR head. The validator scripts come from the explicit checkout below, which
# selects the PR's base sha (the tip of main). Only PR *metadata* (head ref / repo)
# is read from the event; no PR code is checked out or executed.
#
# A pull_request_target job is not attached to the PR head, so a required status
# check named after the job would never appear on the PR head. The result is
# therefore published as a Check Run on pull_request.head.sha through the Checks
# API (same approach as review-gate.yml).
#
# Activation: advisory until the `main promotion gate` ruleset requires the
# check "PRs into main must come from staging".
#
# Known limits (SEC-MVS-01). pull_request_target runs this file from the DEFAULT
# branch, never from the PR. But a required check is matched by NAME and a
# same-repo PR's own workflows can publish that name, so this workflow detects a
# forged same-name Actions job (scripts/check-forged-gate-names.py) and fails closed;
# it cannot see a same-name check POSTed straight to the Checks API (no provenance),
# and cannot make the name unforgeable. That needs a required workflow (org ruleset)
# or a distinct publisher app. The scan runs once, so a PR job that publishes its
# forged name afterwards is missed here; this workflow runs for PRs into main only, so
# PRs into staging rely on that same merge-time run (plan step S5 moves it into review-gate.yml); whoever merges re-runs the detector right
# before the merge (plan `plans/2026-11-16-unforgeable-required-checks.md` in the aec repo; copies of this
# workflow elsewhere do not carry it). Check runs are commit-scoped: a disallowed branch
# at exactly staging's SHA would deliver the identical commit, so its own check
# turns red but staging's success at that SHA is not a content risk.
name: main via staging
on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]
    branches: [main]
permissions:
  contents: read
  checks: write
  # the forged-name scan reads GET /actions/runs/{id}; private repos need this scope
  actions: read
concurrency:
  group: main-via-staging-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  publish-guard-result:
    name: Publish the promotion guard result
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted base (not PR head)
        # actions/checkout@v7 refuses to fetch fork PR code under pull_request_target. This step selects
        # the base sha of the base repository, so it is unaffected. Never add allow-unsafe-pr-checkout.
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - name: Check head branch and publish on the PR head
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          SHA: ${{ github.event.pull_request.head.sha }}
          REPO: ${{ github.repository }}
          CHECK_NAME: PRs into main must come from staging
        run: |
          set -u
          # Fail closed: the named check exists (in_progress) before anything is
          # evaluated, and a rejection completes it as `failure`. A rejected PR can
          # never leave the required name absent or leave an older success standing
          # as the latest result.
          check_id=$(gh api -X POST "repos/$REPO/check-runs" \
            -f name="$CHECK_NAME" -f head_sha="$SHA" \
            -f status="in_progress" \
            -f "output[title]=promotion guard running" \
            -f "output[summary]=Checking the source branch…" --jq .id)
          complete_check() {
            gh api -X PATCH "repos/$REPO/check-runs/$check_id" \
              -f status="completed" -f conclusion="$1" \
              -f "output[title]=$2" -f "output[summary]=$3"
          }
          # Bootstrap: the scripts load from the base sha. If the workflow reached the
          # default branch before them, say so; never exit 127 silently.
          for guard_script in scripts/check-forged-gate-names.py scripts/check-main-source.sh; do
            if [ ! -f "$guard_script" ]; then
              msg="guard script missing on base: $guard_script. Land the scripts and this workflow together; the scripts go to staging first."
              echo "::error::$msg"
              complete_check failure "guard script missing on base" "$msg"
              exit 1
            fi
          done
          # A PR-controlled job can borrow a required check's name (see
          # scripts/check-forged-gate-names.py). Detection only; the unforgeable
          # fix is a required workflow or a distinct publisher app.
          # filter=all: the default (latest) can hide an earlier same-name run. The list
          # is captured on its own so an API failure cannot reach the detector as empty
          # input and read as "none forged".
          set +e
          runs_json=$(gh api "repos/$REPO/commits/$SHA/check-runs?per_page=100&filter=all" --paginate)
          list_rc=$?
          if [ "$list_rc" -eq 0 ]; then
            forged_out=$(printf '%s' "$runs_json" | REPO="$REPO" python3 scripts/check-forged-gate-names.py 2>&1)
            forged_rc=$?
          else
            forged_out="could not list check runs (gh api exit $list_rc); failing closed"
            forged_rc=2
          fi
          source_out=$(HEAD_REF="$HEAD_REF" HEAD_REPO="$HEAD_REPO" REPO="$REPO" \
            bash scripts/check-main-source.sh 2>&1)
          source_rc=$?
          set -e
          printf '%s\n%s\n' "$forged_out" "$source_out"
          if [ "$forged_rc" -ne 0 ]; then
            complete_check failure "forged check name" "$forged_out"
            exit 1
          fi
          if [ "$source_rc" -ne 0 ]; then
            complete_check failure "source branch rejected" "$source_out"
            exit 1
          fi
          complete_check success "source branch ok" "This PR comes from staging."
